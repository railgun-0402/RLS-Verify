services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: rlsdemo
    ports:
      - "5432:5432"

  # MySQL で RLS が難しい理由を体験する用（make mysql-demo）
  mysql:
    image: mysql:8.4
    profiles: ["mysql"]
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: rlsdemo
    ports:
      - "3306:3306"
